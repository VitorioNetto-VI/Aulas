<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamPad</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/fontsource/fonts/inter@latest/latin-400-normal.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/fontsource/fonts/inter@latest/latin-600-normal.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/fontsource/fonts/inter@latest/latin-700-normal.css">
    <script src="https://cdn.jsdelivr.net/npm/gun@1.4.0/gun.js"></script>
    <style>
        :root {
            --bg-color: #0f0f1a;
            --system-color: #1a1a2e;
            --text-color: #e0e0ff;
            --accent: #7c3aed;
            --accent-hover: #6d28d9;
            --accent-glow: rgba(124, 58, 237, 0.3);
            --card-bg: #16162a;
            --card-border: #2a2a4a;
            --input-bg: #1e1e36;
            --input-border: #3a3a5a;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --radius: 12px;
            --radius-sm: 8px;
            --shadow: 0 4px 24px rgba(0,0,0,0.3);
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background:
                radial-gradient(ellipse at 20% 20%, rgba(124, 58, 237, 0.08) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 80%, rgba(59, 130, 246, 0.06) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg-color); }
        ::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 3px; }

        /* HEADER */
        .header {
            background: var(--system-color);
            border-bottom: 1px solid var(--card-border);
            padding: 10px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(20px);
            gap: 12px;
            flex-wrap: wrap;
        }

        .header-brand {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 1.2rem;
            font-weight: 700;
            background: linear-gradient(135deg, #7c3aed, #3b82f6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .room-info {
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-sm);
            padding: 6px 12px;
            font-size: 0.85rem;
            flex: 1;
            max-width: 400px;
        }

        .room-label { color: #888; font-size: 0.8rem; }
        .room-name {
            color: var(--accent);
            font-weight: 700;
            font-family: monospace;
            font-size: 0.95rem;
        }

        .room-input {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--accent);
            font-weight: 700;
            font-family: monospace;
            font-size: 0.95rem;
            outline: none;
            min-width: 80px;
        }

        .btn-icon {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1rem;
            padding: 4px 8px;
            border-radius: 4px;
            transition: var(--transition);
            color: var(--text-color);
        }

        .btn-icon:hover { background: rgba(124, 58, 237, 0.2); }

        .header-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .online-indicator {
            display: flex;
            align-items: center;
            gap: 6px;
            color: var(--success);
            font-size: 0.85rem;
        }

        .online-dot {
            width: 8px; height: 8px;
            background: var(--success);
            border-radius: 50%;
            animation: pulse-dot 2s infinite;
        }

        .online-dot.offline { background: var(--danger); }
        .online-dot.connecting { background: var(--warning); }

        @keyframes pulse-dot {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.3); }
        }

        .username-input {
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            border-radius: var(--radius-sm);
            padding: 6px 10px;
            color: var(--text-color);
            font-size: 0.85rem;
            font-family: inherit;
            outline: none;
            width: 120px;
            transition: var(--transition);
        }

        .username-input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        /* LAYOUT */
        .main-container {
            display: grid;
            grid-template-columns: 1fr 340px;
            min-height: calc(100vh - 57px);
            position: relative;
            z-index: 1;
        }

        /* CONTENT */
        .content-area {
            padding: 20px;
            overflow-y: auto;
            max-height: calc(100vh - 57px);
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* TOOLBAR */
        .toolbar {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: var(--radius);
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .toolbar-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .toolbar-divider {
            width: 1px;
            height: 24px;
            background: var(--card-border);
        }

        .toolbar-label {
            font-size: 0.75rem;
            color: #888;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .toolbar-input {
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            border-radius: var(--radius-sm);
            padding: 6px 10px;
            color: var(--text-color);
            font-size: 0.8rem;
            font-family: inherit;
            outline: none;
            transition: var(--transition);
            width: 280px;
        }

        .toolbar-input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        .toolbar-input::placeholder { color: #555; }

        .btn {
            padding: 6px 12px;
            border: none;
            border-radius: var(--radius-sm);
            font-family: inherit;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 4px;
            background: linear-gradient(135deg, var(--accent), #5b21b6);
            color: white;
        }

        .btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px var(--accent-glow);
        }

        /* STREAM */
        .stream-container {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: var(--radius);
            overflow: hidden;
        }

        .stream-header {
            padding: 10px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--card-border);
        }

        .stream-title {
            font-weight: 600;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .live-badge {
            background: var(--danger);
            color: white;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.65rem;
            font-weight: 700;
            animation: pulse-badge 2s infinite;
        }

        @keyframes pulse-badge {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        .stream-player {
            width: 100%;
            aspect-ratio: 16/9;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .stream-player iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .stream-placeholder { text-align: center; color: #555; }
        .stream-placeholder .icon { font-size: 2.5rem; margin-bottom: 8px; }
        .stream-placeholder p { font-size: 0.8rem; }

        /* EFFECTS BAR */
        .effects-bar {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: var(--radius);
            padding: 10px 16px;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .effects-label {
            font-size: 0.75rem;
            color: #888;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-right: 4px;
        }

        .effect-btn {
            padding: 6px 10px;
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            border-radius: var(--radius-sm);
            color: var(--text-color);
            font-size: 0.75rem;
            cursor: pointer;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .effect-btn:hover {
            border-color: var(--accent);
            background: rgba(124, 58, 237, 0.1);
            transform: translateY(-2px);
        }

        .emoji-btn {
            width: 32px; height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            border-radius: var(--radius-sm);
            font-size: 1rem;
            cursor: pointer;
            transition: var(--transition);
        }

        .emoji-btn:hover {
            transform: scale(1.2);
            border-color: var(--accent);
        }

        /* CHAT */
        .chat-panel {
            background: var(--system-color);
            border-left: 1px solid var(--card-border);
            display: flex;
            flex-direction: column;
            max-height: calc(100vh - 57px);
            position: sticky;
            top: 57px;
        }

        .chat-header {
            padding: 12px 16px;
            border-bottom: 1px solid var(--card-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .chat-header-title {
            font-weight: 600;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .chat-online {
            font-size: 0.75rem;
            color: var(--success);
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            min-height: 0;
        }

        .chat-message {
            display: flex;
            gap: 8px;
            padding: 6px 8px;
            border-radius: var(--radius-sm);
            transition: var(--transition);
            animation: msg-in 0.3s ease;
        }

        @keyframes msg-in {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .chat-message:hover { background: rgba(255,255,255,0.03); }

        .chat-msg-avatar {
            width: 28px; height: 28px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent), #3b82f6);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.7rem;
            flex-shrink: 0;
            color: white;
            font-weight: 700;
        }

        .chat-msg-content { flex: 1; min-width: 0; }

        .chat-msg-header {
            display: flex;
            align-items: baseline;
            gap: 6px;
            margin-bottom: 2px;
        }

        .chat-msg-name {
            font-weight: 600;
            font-size: 0.78rem;
            color: var(--accent);
        }

        .chat-msg-time { font-size: 0.65rem; color: #555; }

        .chat-msg-text {
            font-size: 0.82rem;
            line-height: 1.4;
            word-break: break-word;
        }

        .chat-msg-text img {
            max-width: 180px;
            max-height: 130px;
            border-radius: var(--radius-sm);
            margin-top: 4px;
            display: block;
        }

        .chat-msg-system {
            text-align: center;
            font-size: 0.7rem;
            color: #666;
            padding: 4px;
            font-style: italic;
        }

        .chat-input-area {
            padding: 10px;
            border-top: 1px solid var(--card-border);
        }

        .chat-input-row {
            display: flex;
            gap: 6px;
            align-items: flex-end;
        }

        .chat-input-wrapper { flex: 1; position: relative; }

        .chat-input {
            width: 100%;
            padding: 8px 10px;
            padding-right: 100px;
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            border-radius: var(--radius-sm);
            color: var(--text-color);
            font-size: 0.82rem;
            font-family: inherit;
            outline: none;
            transition: var(--transition);
            resize: none;
            min-height: 38px;
            max-height: 80px;
        }

        .chat-input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        .chat-input-actions {
            position: absolute;
            right: 6px;
            bottom: 5px;
            display: flex;
            gap: 2px;
        }

        .chat-action-btn {
            width: 26px; height: 26px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: transparent;
            border: none;
            color: #888;
            cursor: pointer;
            border-radius: 4px;
            font-size: 0.85rem;
            transition: var(--transition);
        }

        .chat-action-btn:hover {
            color: var(--accent);
            background: rgba(124, 58, 237, 0.1);
        }

        .chat-send-btn {
            width: 38px; height: 38px;
            background: linear-gradient(135deg, var(--accent), #5b21b6);
            border: none;
            border-radius: var(--radius-sm);
            color: white;
            font-size: 1rem;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .chat-send-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 4px 12px var(--accent-glow);
        }

        .recording-indicator {
            display: none;
            align-items: center;
            gap: 8px;
            padding: 6px 10px;
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            border-radius: var(--radius-sm);
            margin-bottom: 6px;
            font-size: 0.75rem;
            color: var(--danger);
        }

        .recording-indicator.active { display: flex; }

        .rec-dot {
            width: 6px; height: 6px;
            background: var(--danger);
            border-radius: 50%;
            animation: pulse-dot 1s infinite;
        }

        /* TOAST */
        .toast-container {
            position: fixed;
            top: 70px;
            right: 20px;
            z-index: 10000;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .toast {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-sm);
            padding: 10px 14px;
            font-size: 0.82rem;
            box-shadow: var(--shadow);
            animation: toast-in 0.3s ease, toast-out 0.3s ease 2.7s forwards;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        @keyframes toast-in {
            from { opacity: 0; transform: translateX(40px); }
            to { opacity: 1; transform: translateX(0); }
        }

        @keyframes toast-out {
            from { opacity: 1; }
            to { opacity: 0; transform: translateX(40px); }
        }

        /* EFFECTS */
        .shake-effect { animation: shake 0.5s ease-in-out; }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            10%, 50%, 90% { transform: translateX(-4px); }
            30%, 70% { transform: translateX(4px); }
        }

        .flash-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: white;
            z-index: 99999;
            pointer-events: none;
            animation: flash-anim 0.4s ease-out forwards;
        }

        @keyframes flash-anim {
            0% { opacity: 0.8; }
            100% { opacity: 0; }
        }

        .nudge-effect { animation: nudge 0.6s ease-in-out; }

        @keyframes nudge {
            0% { transform: translate(0, 0); }
            10% { transform: translate(-8px, -4px); }
            20% { transform: translate(8px, 4px); }
            30% { transform: translate(-6px, 2px); }
            40% { transform: translate(6px, -2px); }
            50% { transform: translate(-4px, 4px); }
            60% { transform: translate(4px, -4px); }
            70% { transform: translate(-2px, 2px); }
            80% { transform: translate(2px, -2px); }
            90% { transform: translate(-1px, 1px); }
            100% { transform: translate(0, 0); }
        }

        .rainbow-effect { animation: rainbow-bg 2s linear; }

        @keyframes rainbow-bg {
            0% { filter: hue-rotate(0deg); }
            100% { filter: hue-rotate(360deg); }
        }

        #particleCanvas {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 9998;
        }

        /* RESPONSIVE */
        @media (max-width: 900px) {
            .main-container { grid-template-columns: 1fr; }
            .chat-panel {
                position: fixed;
                bottom: 0; left: 0; right: 0;
                max-height: 50vh;
                border-top: 1px solid var(--card-border);
                border-left: none;
                transform: translateY(calc(100% - 50px));
                transition: var(--transition);
                z-index: 200;
            }
            .chat-panel.expanded { transform: translateY(0); }
            .toolbar-input { width: 160px; }
            .room-info { max-width: none; }
        }
    </style>
</head>
<body>
    <canvas id="particleCanvas"></canvas>
    <div class="toast-container" id="toastContainer"></div>

    <!-- HEADER -->
    <header class="header">
        <div class="header-brand">
            <span>🎬</span>
            <span>StreamPad</span>
        </div>

        <div class="room-info">
            <span class="room-label">streampad.vercel.app/#</span>
            <input type="text" class="room-input" id="roomInput" placeholder="nome-da-sala" value="">
            <button class="btn-icon" id="btnGoRoom" title="Ir para sala">🚀</button>
            <button class="btn-icon" id="btnCopyRoom" title="Copiar link"></button>
        </div>

        <div class="header-right">
            <div class="online-indicator">
                <span class="online-dot" id="connectionDot"></span>
                <span id="onlineCount">Conectando...</span>
            </div>
            <input type="text" class="username-input" id="usernameInput" placeholder="Seu nome..." value="">
        </div>
    </header>

    <!-- MAIN -->
    <div class="main-container" id="mainContainer">
        <!-- CONTENT -->
        <main class="content-area" id="contentArea">
            <!-- TOOLBAR -->
            <div class="toolbar">
                <div class="toolbar-group">
                    <span class="toolbar-label">📺 Stream:</span>
                    <input type="text" class="toolbar-input" id="inputStreamUrl" placeholder="Cole link do YouTube (vídeo ou playlist)...">
                    <button class="btn" id="btnSetStream">Definir</button>
                </div>
            </div>

            <!-- STREAM -->
            <div class="stream-container" id="streamContainer">
                <div class="stream-header">
                    <div class="stream-title">
                        <span>📺</span> Transmissão
                        <span class="live-badge" id="liveBadge" style="display:none;">AO VIVO</span>
                    </div>
                </div>
                <div class="stream-player" id="streamPlayer">
                    <div class="stream-placeholder">
                        <div class="icon">📺</div>
                        <p>Cole um link do YouTube na barra acima para iniciar a transmissão compartilhada</p>
                    </div>
                </div>
            </div>

            <!-- EFFECTS BAR -->
            <div class="effects-bar">
                <span class="effects-label">✨ Efeitos:</span>
                <button class="effect-btn" data-effect="shake">📳 Tremer</button>
                <button class="effect-btn" data-effect="flash">⚡ Flash</button>
                <button class="effect-btn" data-effect="nudge"> Nudge</button>
                <button class="effect-btn" data-effect="rainbow">🌈 Rainbow</button>
                <button class="effect-btn" data-effect="fire">🔥 Fogo</button>
                <button class="effect-btn" data-effect="hearts">💕 Corações</button>
                <button class="effect-btn" data-effect="stars">⭐ Estrelas</button>
                <button class="effect-btn" data-effect="confetti">🎊 Confete</button>

                <div class="toolbar-divider"></div>

                <span class="effects-label">😊</span>
                <button class="emoji-btn" data-emoji="😊">😊</button>
                <button class="emoji-btn" data-emoji="😢">😢</button>
                <button class="emoji-btn" data-emoji="😃">😃</button>
                <button class="emoji-btn" data-emoji="😛">😛</button>
                <button class="emoji-btn" data-emoji="😉">😉</button>
                <button class="emoji-btn" data-emoji="😮">😮</button>
                <button class="emoji-btn" data-emoji="">😡</button>
                <button class="emoji-btn" data-emoji="😘"></button>
                <button class="emoji-btn" data-emoji="😎">😎</button>
                <button class="emoji-btn" data-emoji="😭">😭</button>
                <button class="emoji-btn" data-emoji="❤️">❤️</button>
                <button class="emoji-btn" data-emoji="🤣">🤣</button>
            </div>
        </main>

        <!-- CHAT -->
        <aside class="chat-panel" id="chatPanel">
            <div class="chat-header">
                <div class="chat-header-title">💬 Chat ao Vivo</div>
                <div class="chat-online">
                    <span class="online-dot"></span>
                    <span id="chatOnlineCount">1 online</span>
                </div>
            </div>
            <div class="chat-messages" id="chatMessages">
                <div class="chat-msg-system">Conectando...</div>
            </div>
            <div class="chat-input-area">
                <div class="recording-indicator" id="recordingIndicator">
                    <span class="rec-dot"></span>
                    <span>Gravando...</span>
                    <button class="btn" style="background:var(--danger);margin-left:auto;padding:4px 8px;" id="btnStopRecording">⏹️ Parar</button>
                </div>
                <div class="chat-input-row">
                    <div class="chat-input-wrapper">
                        <textarea class="chat-input" id="chatInput" placeholder="Mensagem..." rows="1"></textarea>
                        <div class="chat-input-actions">
                            <button class="chat-action-btn" id="btnAttach" title="Anexar imagem">📎</button>
                            <button class="chat-action-btn" id="btnVoice" title="Gravar áudio"></button>
                            <button class="chat-action-btn" id="btnEmoji" title="Emoji"></button>
                        </div>
                    </div>
                    <button class="chat-send-btn" id="btnSend" title="Enviar">📤</button>
                </div>
            </div>
        </aside>
    </div>

    <script>
    /* ============================================
       StreamPad - Versão Final
       - Sem Pad Colaborativo
       - Chat persistente (estático/mural)
       - YouTube sincronizado entre todos
       - Tudo compartilhado na mesma sala
       ============================================ */

    // ==========================================
    // EventBus
    // ==========================================
    class EventBus {
        constructor() { this.listeners = {}; }
        on(event, cb) {
            if (!this.listeners[event]) this.listeners[event] = [];
            this.listeners[event].push(cb);
        }
        emit(event, data) {
            if (!this.listeners[event]) return;
            this.listeners[event].forEach(cb => cb(data));
        }
    }

    // ==========================================
    // Toast
    // ==========================================
    class Toast {
        static show(msg, icon = '✅') {
            const c = document.getElementById('toastContainer');
            const t = document.createElement('div');
            t.className = 'toast';
            t.innerHTML = `<span>${icon}</span> ${msg}`;
            c.appendChild(t);
            setTimeout(() => t.remove(), 3000);
        }
    }

    // ==========================================
    // RoomManager
    // ==========================================
    class RoomManager {
        constructor() {
            this.roomId = this.getRoomFromHash();
            this.input = document.getElementById('roomInput');
            this.input.value = this.roomId;
            this.bindEvents();
        }

        getRoomFromHash() {
            const h = window.location.hash.slice(1);
            return h ? decodeURIComponent(h).replace(/[^a-zA-Z0-9_-]/g, '') : 'default';
        }

        bindEvents() {
            this.input.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') this.goToRoom();
            });
            document.getElementById('btnGoRoom').addEventListener('click', () => this.goToRoom());
            document.getElementById('btnCopyRoom').addEventListener('click', () => this.copyLink());
        }

        goToRoom() {
            const val = this.input.value.trim().replace(/[^a-zA-Z0-9_-]/g, '') || 'default';
            window.location.hash = val;
            window.location.reload();
        }

        copyLink() {
            const link = window.location.origin + window.location.pathname + '#' + this.roomId;
            navigator.clipboard.writeText(link).then(() => {
                Toast.show('Link da sala copiado!', '📋');
            }).catch(() => {
                const i = document.createElement('input');
                i.value = link;
                document.body.appendChild(i);
                i.select();
                document.execCommand('copy');
                document.body.removeChild(i);
                Toast.show('Link da sala copiado!', '📋');
            });
        }

        getRoomId() { return this.roomId; }
    }

    // ==========================================
    // GunSync - Sincronização via Gun.js
    // ==========================================
    class GunSync {
        constructor(roomId, eventBus) {
            this.roomId = roomId;
            this.eventBus = eventBus;
            this.userId = 'u_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
            this.onlineUsers = new Map();
            this.gun = null;
            this.roomNode = null;
            this.init();
        }

        init() {
            try {
                // Inicializa Gun.js com múltiplos relays para redundância
                this.gun = Gun({
                    peers: [
                        'https://gun-manhattan.herokuapp.com/gun',
                        'https://gun-us.herokuapp.com/gun',
                        'https://peer.wallie.io/gun'
                    ],
                    localStorage: false,
                    radisk: false
                });

                // Nó da sala
                this.roomNode = this.gun.get('streampad_final').get(this.roomId);

                console.log('🔗 Gun.js inicializado, sala:', this.roomId);

                // === CHAT - Carrega mensagens existentes E escuta novas ===
                // .map().on() retorna TUDO que já existe + escuta mudanças
                this.roomNode.get('chat').map().on((data, key) => {
                    if (!data || !data.timestamp) return;
                    if (data.senderId === this.userId) return; // ignora minhas próprias (já renderizadas)
                    this.eventBus.emit('gun:chat', data);
                });

                // === STREAM - Carrega URL atual E escuta mudanças ===
                this.roomNode.get('stream').on((data) => {
                    if (!data || !data.url) return;
                    if (data.senderId === this.userId) return;
                    console.log('📺 Stream recebida de outro usuário:', data.url);
                    this.eventBus.emit('gun:stream', data);
                });

                // === PRESENÇA ===
                this.roomNode.get('presence').map().on((data, key) => {
                    if (!data || !data.userId) return;
                    if (data.userId === this.userId) return;
                    if (Date.now() - data.timestamp < 10000) {
                        this.onlineUsers.set(data.userId, data);
                    } else {
                        this.onlineUsers.delete(data.userId);
                    }
                    this.updateOnlineCount();
                });

                // === EFEITOS ===
                this.roomNode.get('effects').map().on((data, key) => {
                    if (!data || !data.effect) return;
                    if (data.senderId === this.userId) return;
                    this.eventBus.emit('gun:effect', data);
                });

                // Anuncia presença
                this.announcePresence();
                this.presenceInterval = setInterval(() => this.announcePresence(), 3000);
                this.cleanInterval = setInterval(() => this.cleanPresence(), 5000);

                // Timeout de conexão
                setTimeout(() => {
                    this.eventBus.emit('gun:connected');
                }, 1000);

            } catch (e) {
                console.error('Erro Gun.js:', e);
                this.eventBus.emit('gun:error', e);
            }
        }

        announcePresence() {
            if (!this.roomNode) return;
            this.roomNode.get('presence').get(this.userId).put({
                userId: this.userId,
                timestamp: Date.now()
            });
        }

        cleanPresence() {
            const now = Date.now();
            this.onlineUsers.forEach((data, uid) => {
                if (now - data.timestamp > 10000) this.onlineUsers.delete(uid);
            });
            this.updateOnlineCount();
        }

        updateOnlineCount() {
            const count = this.onlineUsers.size + 1;
            this.eventBus.emit('gun:online', { count });
        }

        sendChat(msg) {
            if (!this.roomNode) return;
            const id = 'm_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5);
            // Salva no Gun.js - fica persistente na sala
            this.roomNode.get('chat').get(id).put(msg);
            console.log('💬 Mensagem enviada:', msg.text);
        }

        sendStream(url) {
            if (!this.roomNode) return;
            // Salva a URL da stream - todos que entrarem depois vão ver
            this.roomNode.get('stream').put({
                url: url,
                senderId: this.userId,
                timestamp: Date.now()
            });
            console.log('📺 Stream enviada:', url);
        }

        sendEffect(effect, username) {
            if (!this.roomNode) return;
            const id = 'e_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5);
            this.roomNode.get('effects').get(id).put({
                effect,
                username,
                senderId: this.userId,
                timestamp: Date.now()
            });
        }

        getUserId() { return this.userId; }
    }

    // ==========================================
    // StreamManager
    // ==========================================
    class StreamManager {
        constructor() {
            this.currentUrl = '';
            this.loaded = false;
        }

        setStream(url, isRemote = false) {
            if (this.currentUrl === url && this.loaded) return;
            this.currentUrl = url;
            this.loaded = true;
            this.loadStream(url);
        }

        loadStream(url) {
            const player = document.getElementById('streamPlayer');
            const badge = document.getElementById('liveBadge');
            const inputUrl = document.getElementById('inputStreamUrl');

            if (!url) {
                player.innerHTML = '<div class="stream-placeholder"><div class="icon">📺</div><p>Cole um link do YouTube na barra acima para iniciar a transmissão compartilhada</p></div>';
                if (badge) badge.style.display = 'none';
                return;
            }

            const videoId = this.extractVideoId(url);
            const playlistId = this.extractPlaylistId(url);
            let embedUrl = '';

            if (playlistId && videoId) {
                embedUrl = `https://www.youtube.com/embed/${videoId}?list=${playlistId}&autoplay=1`;
            } else if (playlistId) {
                embedUrl = `https://www.youtube.com/embed/videoseries?list=${playlistId}&autoplay=1`;
            } else if (videoId) {
                embedUrl = `https://www.youtube.com/embed/${videoId}?autoplay=1`;
            } else if (url.includes('twitch.tv')) {
                const ch = url.split('twitch.tv/')[1]?.split(/[/?]/)[0];
                if (ch) embedUrl = `https://player.twitch.tv/?channel=${ch}&parent=${location.hostname}&autoplay=true`;
            } else {
                embedUrl = url;
            }

            if (embedUrl) {
                player.innerHTML = `<iframe src="${embedUrl}" allow="autoplay; encrypted-media; fullscreen; picture-in-picture" allowfullscreen></iframe>`;
                if (badge) badge.style.display = 'inline';
                if (inputUrl && !isRemote) inputUrl.value = url;
            }
        }

        extractVideoId(url) {
            const patterns = [
                /(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/embed\/)([a-zA-Z0-9_-]{11})/,
                /youtube\.com\/shorts\/([a-zA-Z0-9_-]{11})/
            ];
            for (const p of patterns) {
                const m = url.match(p);
                if (m) return m[1];
            }
            return null;
        }

        extractPlaylistId(url) {
            const m = url.match(/[?&]list=([a-zA-Z0-9_-]+)/);
            return m ? m[1] : null;
        }
    }

    // ==========================================
    // EffectsManager
    // ==========================================
    class EffectsManager {
        constructor() {
            this.canvas = document.getElementById('particleCanvas');
            this.ctx = this.canvas ? this.canvas.getContext('2d') : null;
            this.particles = [];
            this.animating = false;
            this.resize();
            window.addEventListener('resize', () => this.resize());
        }

        resize() {
            if (!this.canvas) return;
            this.canvas.width = window.innerWidth;
            this.canvas.height = window.innerHeight;
        }

        trigger(effect) {
            switch (effect) {
                case 'shake': this.shake(); break;
                case 'flash': this.flash(); break;
                case 'nudge': this.nudge(); break;
                case 'rainbow': this.rainbow(); break;
                case 'fire': this.particles('fire'); break;
                case 'hearts': this.particles('hearts'); break;
                case 'stars': this.particles('stars'); break;
                case 'confetti': this.particles('confetti'); break;
            }
        }

        shake() {
            const m = document.getElementById('mainContainer');
            m.classList.add('shake-effect');
            setTimeout(() => m.classList.remove('shake-effect'), 500);
        }

        flash() {
            const o = document.createElement('div');
            o.className = 'flash-overlay';
            document.body.appendChild(o);
            setTimeout(() => o.remove(), 400);
        }

        nudge() {
            const m = document.getElementById('mainContainer');
            m.classList.add('nudge-effect');
            setTimeout(() => m.classList.remove('nudge-effect'), 600);
        }

        rainbow() {
            const m = document.getElementById('mainContainer');
            m.classList.add('rainbow-effect');
            setTimeout(() => m.classList.remove('rainbow-effect'), 2000);
        }

        particles(type) {
            if (!this.ctx) return;
            this.particles = [];
            const count = type === 'confetti' ? 150 : 60;
            for (let i = 0; i < count; i++) this.particles.push(this.createParticle(type));
            if (!this.animating) {
                this.animating = true;
                this.animate(type);
            }
        }

        createParticle(type) {
            const p = {
                x: Math.random() * this.canvas.width,
                y: this.canvas.height + 20,
                vx: (Math.random() - 0.5) * 4,
                vy: -(Math.random() * 8 + 4),
                size: Math.random() * 8 + 4,
                life: 1,
                decay: Math.random() * 0.015 + 0.005,
                rotation: Math.random() * Math.PI * 2,
                rotSpeed: (Math.random() - 0.5) * 0.1,
                type
            };

            switch (type) {
                case 'fire':
                    p.x = this.canvas.width / 2 + (Math.random() - 0.5) * 200;
                    p.y = this.canvas.height;
                    p.vy = -(Math.random() * 6 + 3);
                    p.vx = (Math.random() - 0.5) * 2;
                    p.color = `hsl(${Math.random() * 40 + 10}, 100%, ${Math.random() * 30 + 50}%)`;
                    break;
                case 'hearts':
                    p.x = Math.random() * this.canvas.width;
                    p.y = Math.random() * this.canvas.height;
                    p.vy = -(Math.random() * 2 + 1);
                    p.vx = (Math.random() - 0.5) * 1;
                    p.emoji = '❤️';
                    p.size = Math.random() * 16 + 12;
                    break;
                case 'stars':
                    p.x = Math.random() * this.canvas.width;
                    p.y = Math.random() * this.canvas.height * 0.5;
                    p.vy = Math.random() * 2 + 1;
                    p.vx = (Math.random() - 0.5) * 1;
                    p.emoji = '⭐';
                    p.size = Math.random() * 14 + 10;
                    break;
                case 'confetti':
                    p.x = Math.random() * this.canvas.width;
                    p.y = -20;
                    p.vy = Math.random() * 4 + 2;
                    p.vx = (Math.random() - 0.5) * 3;
                    p.color = `hsl(${Math.random() * 360}, 80%, 60%)`;
                    p.width = Math.random() * 8 + 4;
                    p.height = Math.random() * 4 + 2;
                    break;
            }
            return p;
        }

        animate(type) {
            if (!this.ctx) return;
            this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
            this.particles = this.particles.filter(p => p.life > 0);

            if (this.particles.length === 0) {
                this.animating = false;
                this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
                return;
            }

            this.particles.forEach(p => {
                p.x += p.vx;
                p.y += p.vy;
                p.life -= p.decay;
                p.rotation += p.rotSpeed;
                if (type === 'confetti') p.vy += 0.05;

                this.ctx.save();
                this.ctx.globalAlpha = p.life;
                this.ctx.translate(p.x, p.y);
                this.ctx.rotate(p.rotation);

                if (p.emoji) {
                    this.ctx.font = `${p.size}px serif`;
                    this.ctx.textAlign = 'center';
                    this.ctx.textBaseline = 'middle';
                    this.ctx.fillText(p.emoji, 0, 0);
                } else if (type === 'confetti') {
                    this.ctx.fillStyle = p.color;
                    this.ctx.fillRect(-p.width / 2, -p.height / 2, p.width, p.height);
                } else {
                    this.ctx.fillStyle = p.color;
                    this.ctx.beginPath();
                    this.ctx.arc(0, 0, p.size * p.life, 0, Math.PI * 2);
                    this.ctx.fill();
                }
                this.ctx.restore();
            });

            requestAnimationFrame(() => this.animate(type));
        }
    }

    // ==========================================
    // ChatManager - Chat persistente (mural estático)
    // ==========================================
    class ChatManager {
        constructor(gunSync, eventBus) {
            this.gunSync = gunSync;
            this.eventBus = eventBus;
            this.isRecording = false;
            this.mediaRecorder = null;
            this.audioChunks = [];
            this.renderedMessages = new Set();
            this.init();
        }

        init() {
            this.renderWelcome();
            this.setupListeners();
        }

        setupListeners() {
            // Quando receber mensagem do Gun.js (de outro usuário)
            this.eventBus.on('gun:chat', (data) => {
                if (this.renderedMessages.has(data.id)) return;
                this.renderedMessages.add(data.id);
                this.addMessage(data);
            });
        }

        getUsername() {
            return document.getElementById('usernameInput').value.trim() || 'Anônimo';
        }

        sendMessage(text, imageUrl = null) {
            if (!text.trim() && !imageUrl) return;
            const msg = {
                id: 'm_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5),
                username: this.getUsername(),
                text: text.trim(),
                image: imageUrl,
                timestamp: Date.now(),
                senderId: this.gunSync.getUserId()
            };
            // Renderiza localmente primeiro
            this.renderedMessages.add(msg.id);
            this.addMessage(msg);
            // Envia para o Gun.js (persiste na sala)
            this.gunSync.sendChat(msg);
        }

        addMessage(msg) {
            const c = document.getElementById('chatMessages');
            const div = document.createElement('div');
            div.className = 'chat-message';
            const time = new Date(msg.timestamp).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
            const avatar = msg.username ? msg.username.charAt(0).toUpperCase() : '?';
            let text = this.escapeHtml(msg.text || '');
            text = text.replace(/(https?:\/\/[^\s]+)/g, '<a href="$1" target="_blank" style="color:var(--accent);">$1</a>');
            let img = msg.image ? `<br><img src="${msg.image}" style="max-width:180px;border-radius:8px;margin-top:4px;display:block;">` : '';

            div.innerHTML = `
                <div class="chat-msg-avatar">${avatar}</div>
                <div class="chat-msg-content">
                    <div class="chat-msg-header">
                        <span class="chat-msg-name">${this.escapeHtml(msg.username || 'Anônimo')}</span>
                        <span class="chat-msg-time">${time}</span>
                    </div>
                    <div class="chat-msg-text">${text}${img}</div>
                </div>
            `;
            c.appendChild(div);
            c.scrollTop = c.scrollHeight;
        }

        addSystem(text) {
            const c = document.getElementById('chatMessages');
            const div = document.createElement('div');
            div.className = 'chat-msg-system';
            div.textContent = text;
            c.appendChild(div);
            c.scrollTop = c.scrollHeight;
        }

        renderWelcome() {
            document.getElementById('chatMessages').innerHTML = '<div class="chat-msg-system">Bem-vindo ao StreamPad! 🎬</div>';
        }

        escapeHtml(text) {
            const d = document.createElement('div');
            d.textContent = text;
            return d.innerHTML;
        }

        async startRecording() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                this.mediaRecorder = new MediaRecorder(stream);
                this.audioChunks = [];
                this.mediaRecorder.ondataavailable = (e) => this.audioChunks.push(e.data);
                this.mediaRecorder.onstop = () => {
                    const blob = new Blob(this.audioChunks, { type: 'audio/webm' });
                    const reader = new FileReader();
                    reader.onloadend = () => this.sendMessage(' Áudio gravado', reader.result);
                    reader.readAsDataURL(blob);
                    stream.getTracks().forEach(t => t.stop());
                };
                this.mediaRecorder.start();
                this.isRecording = true;
                document.getElementById('recordingIndicator').classList.add('active');
            } catch (e) {
                alert('Não foi possível acessar o microfone: ' + e.message);
            }
        }

        stopRecording() {
            if (this.mediaRecorder && this.isRecording) {
                this.mediaRecorder.stop();
                this.isRecording = false;
                document.getElementById('recordingIndicator').classList.remove('active');
            }
        }
    }

    // ==========================================
    // App
    // ==========================================
    class App {
        constructor() {
            this.eventBus = new EventBus();
            this.room = new RoomManager();
            this.gunSync = new GunSync(this.room.getRoomId(), this.eventBus);
            this.stream = new StreamManager();
            this.effects = new EffectsManager();
            this.chat = new ChatManager(this.gunSync, this.eventBus);
            this.init();
        }

        init() {
            this.bindStream();
            this.bindChat();
            this.bindEffects();
            this.bindEmojis();
            this.bindGunEvents();
            console.log('🎬 StreamPad iniciado na sala:', this.room.getRoomId());
        }

        bindGunEvents() {
            this.eventBus.on('gun:connected', () => {
                const dot = document.getElementById('connectionDot');
                if (dot) dot.classList.remove('connecting', 'offline');
                Toast.show(`Conectado à sala "${this.room.getRoomId()}"`, '🎉');
                this.chat.addSystem(`Você entrou na sala "${this.room.getRoomId()}"`);
            });

            this.eventBus.on('gun:error', () => {
                const dot = document.getElementById('connectionDot');
                if (dot) { dot.classList.remove('connecting'); dot.classList.add('offline'); }
            });

            this.eventBus.on('gun:online', ({ count }) => {
                document.getElementById('chatOnlineCount').textContent = count + ' online';
                document.getElementById('onlineCount').textContent = count + ' online';
            });

            // STREAM - Quando outro usuário define uma stream, carrega para todos
            this.eventBus.on('gun:stream', (data) => {
                if (data.url) {
                    console.log('📺 Recebendo stream de outro usuário:', data.url);
                    this.stream.setStream(data.url, true);
                    document.getElementById('inputStreamUrl').value = data.url;
                    this.chat.addSystem('📺 A stream foi atualizada por outro usuário');
                }
            });

            // EFEITOS - Quando outro usuário envia efeito
            this.eventBus.on('gun:effect', (data) => {
                this.effects.trigger(data.effect);
                this.chat.addSystem(`✨ ${data.username} enviou: ${data.effect}`);
            });
        }

        bindStream() {
            const btnSet = document.getElementById('btnSetStream');
            const inputUrl = document.getElementById('inputStreamUrl');

            btnSet.addEventListener('click', () => {
                const url = inputUrl.value.trim();
                if (url) {
                    this.stream.setStream(url, false);
                    this.gunSync.sendStream(url);
                    Toast.show('Stream definida para todos na sala!', '📺');
                    this.chat.addSystem('📺 Stream atualizada');
                }
            });

            inputUrl.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') btnSet.click();
            });
        }

        bindChat() {
            const input = document.getElementById('chatInput');
            const sendBtn = document.getElementById('btnSend');

            const send = () => {
                if (input.value.trim()) {
                    this.chat.sendMessage(input.value);
                    input.value = '';
                    input.style.height = 'auto';
                }
            };

            sendBtn.addEventListener('click', send);
            input.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
            });

            input.addEventListener('input', () => {
                input.style.height = 'auto';
                input.style.height = Math.min(input.scrollHeight, 80) + 'px';
            });

            document.getElementById('btnVoice').addEventListener('click', () => {
                if (this.chat.isRecording) this.chat.stopRecording();
                else this.chat.startRecording();
            });

            document.getElementById('btnStopRecording').addEventListener('click', () => this.chat.stopRecording());

            document.getElementById('btnEmoji').addEventListener('click', () => {
                input.value += '😊';
                input.focus();
            });

            document.getElementById('btnAttach').addEventListener('click', () => {
                const fi = document.createElement('input');
                fi.type = 'file';
                fi.accept = 'image/*';
                fi.onchange = (e) => {
                    const file = e.target.files[0];
                    if (file) {
                        const reader = new FileReader();
                        reader.onload = (ev) => this.chat.sendMessage('', ev.target.result);
                        reader.readAsDataURL(file);
                    }
                };
                fi.click();
            });

            const chatPanel = document.getElementById('chatPanel');
            chatPanel.querySelector('.chat-header').addEventListener('click', () => {
                if (window.innerWidth <= 900) chatPanel.classList.toggle('expanded');
            });
        }

        bindEffects() {
            document.querySelectorAll('.effect-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const effect = btn.dataset.effect;
                    this.effects.trigger(effect);
                    const username = document.getElementById('usernameInput').value.trim() || 'Anônimo';
                    this.gunSync.sendEffect(effect, username);
                    this.chat.addSystem(`✨ Você enviou: ${effect}`);
                });
            });
        }

        bindEmojis() {
            document.querySelectorAll('.emoji-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const input = document.getElementById('chatInput');
                    input.value += btn.dataset.emoji;
                    input.focus();
                });
            });
        }
    }

    // Inicializar
    document.addEventListener('DOMContentLoaded', () => {
        window.app = new App();
    });
    </script>
</body>
</html>
